name: Bug report
description: Something in FinTrack does not work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. FinTrack is self-hosted, so the two things
        that make a report actionable are **how you deployed it** and **what the
        logs said** - without those, most bugs are unreproducible.

        Security issues do not belong here: see
        [SECURITY.md](https://github.com/AshishKapoor/fintrack/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        1. Imported a CSV from my bank
        2. Expected 42 transactions, got 41
        3. The missing one was a refund with a negative amount
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: >
        The image tag you are running, or the commit if you built from source.
        `docker compose images` prints the tags.
      placeholder: "ghcr.io/ashishkapoor/fintrack-api:0.9.1, or commit 4367dd1"
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How is it deployed
      options:
        - Docker Compose (the default stack)
        - Render one-click deploy
        - Unraid / TrueNAS / PikaPods
        - Kubernetes or another orchestrator
        - Local development (make dev)
        - Something else
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: >
        `docker compose logs api worker --tail 100`. Redact anything that
        identifies you - and note that log lines can contain payee names.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: >
        Browser and OS if it is a UI bug; screenshots welcome. If it involves
        bank sync, say which provider.

version: 2
updates:
  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      radix:
        patterns: ["@radix-ui/*"]
    ignore:
      # orval 8 changed the custom-mutator contract to fetch-style calls;
      # migrating the whole client is a deliberate project, not a dep bump.
      - dependency-name: orval
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /apps/landing
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      radix:
        patterns: ["@radix-ui/*"]
    ignore:
      # TypeScript 7 (the native-port preview) breaks Next's path aliases.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Tailwind 4 on the landing site is a real migration, tracked separately.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# This workflow runs ~20 third-party actions across eight jobs and needs to
# read the repository and nothing else. Without this block it inherits the
# repository default token, which is read-write across contents, issues,
# packages and more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, but never a run on main: back-to-back merges
  # used to kill the earlier merge's run, which is how a schema drift reached
  # main with the gate that would have caught it never having executed.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  api:
    name: API (lint + tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fintrack
          POSTGRES_USER: fintrack
          POSTGRES_PASSWORD: fintrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fintrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: app.settings.dev
      DJANGO_ENV: development
      SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_ALLOWED_HOSTS: localhost 127.0.0.1
      DATABASE_NAME: fintrack
      DATABASE_USER: fintrack
      DATABASE_PASSWORD: fintrack
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      # No broker in the unit-test job; tasks run inline.
      CELERY_TASK_ALWAYS_EAGER: "True"

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Check for missing migrations
        run: uv run manage.py makemigrations --check --dry-run

      - name: Run tests
        run: uv run manage.py test

      # The committed OpenAPI schema drives the generated SDK in
      # web/app/client/gen; drift means the SDK lies about the API.
      - name: Schema is in sync with the backend
        run: ../../scripts/check_schema_sync.sh

  web:
    name: Web (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v7

      # The repo has no root package.json, so the version cannot be inferred.
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # The api job checks pft.yaml still matches the backend; this checks the
      # committed SDK still matches pft.yaml. Neither half catches the other's
      # drift, so both are needed to keep web/app/client/gen honest.
      - name: Generated client is in sync with the schema
        run: |
          pnpm orval
          git diff --exit-code -- app/client/gen

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test

      - name: Typecheck and build
        run: pnpm run build

  landing:
    name: Landing (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/landing

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/landing/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

  sdk-ts:
    name: SDK (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-ts

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/sdk-ts/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # The committed generated client must match the committed schema.
      - name: Generated client is current
        run: |
          pnpm run generate
          git diff --exit-code src/gen || {
            echo "::error::packages/sdk-ts/src/gen is stale. Run 'pnpm run generate' and commit."; exit 1; }

      - name: Build
        run: pnpm run build

  sdk-py:
    name: SDK (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-py

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Lockfile is up to date
        run: uv lock --check

      - name: Generated client is current
        run: |
          uvx openapi-python-client@0.29.0 generate \
            --path ../../apps/web/schema/pft.yaml \
            --output-path fintrack_sdk --meta none --overwrite
          python3 post_generate.py
          git diff --exit-code fintrack_sdk || {
            echo "::error::packages/sdk-py/fintrack_sdk is stale. Regenerate and commit."; exit 1; }

      - name: Build and import
        run: |
          uv build
          uv venv .ci-venv
          uv pip install -p .ci-venv dist/*.whl
          .ci-venv/bin/python -c "import fintrack_sdk; from fintrack_sdk import AuthenticatedClient; print('import OK')"

  pre-commit:
    name: pre-commit (all files)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # trailing-whitespace, check-yaml, detect-private-key and friends were
      # advisory-only for anyone who skipped `pre-commit install` - this is
      # the backstop. `--all-files` rather than the action's default changed-
      # files scan, so a hook whose config changes (e.g. the ruff rev below)
      # is re-checked against the whole tree, not just this PR's diff.
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files

  stack:
    name: Docker stack smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Bootstrap env files
        run: make bootstrap

      # This is the job that would have caught the web image failing to build
      # and the API booting with a placeholder secret.
      - name: Build images
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d

      - name: Wait for the API to become healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/healthz/ > /dev/null; then
              echo "API healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "API never became healthy" >&2
          docker compose logs
          exit 1

      - name: Web is served
        run: curl -fsS -o /dev/null http://localhost:5173

      # Signup bootstraps a workspace, a budget file, a Cash account and the
      # standard categories, so this reads those back and posts a real balanced
      # ledger transaction against them. It also asserts the list envelope,
      # which is the shape every list endpoint returns since pagination became
      # the project default.
      - name: Register a user and create a transaction
        run: |
          set -euo pipefail
          EMAIL="ci-$(date +%s)@example.com"
          PASSWORD='Sup3rSecret!pass'
          API=http://localhost:8000

          curl -fsS -X POST "$API/api/v1/register/" \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\",\"confirm_password\":\"$PASSWORD\"}" > /dev/null

          TOKEN=$(curl -fsS -X POST "$API/api/token/" \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\"}" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["access"])')
          AUTH="Authorization: Bearer $TOKEN"

          # `first_id` doubles as the envelope assertion: a bare array, or a
          # response missing `results`, fails here rather than silently.
          first_id() {
            python3 -c 'import sys,json; print(json.load(sys.stdin)["results"][0]["id"])'
          }

          BUDGET_FILE=$(curl -fsS -H "$AUTH" "$API/api/v1/finance/budget-files/" | first_id)
          ACCOUNT=$(curl -fsS -H "$AUTH" \
            "$API/api/v1/finance/accounts/?budget_file=$BUDGET_FILE" | first_id)
          CATEGORY=$(curl -fsS -H "$AUTH" \
            "$API/api/v1/finance/categories/?budget_file=$BUDGET_FILE" | first_id)

          # Two postings summing to zero - anything else is rejected by the
          # serializer and, behind it, migration 0006's deferred DB trigger.
          curl -fsS -X POST "$API/api/v1/finance/transactions/" \
            -H "$AUTH" -H 'Content-Type: application/json' \
            -d "{\"budget_file\": $BUDGET_FILE,
                 \"transaction_date\": \"2026-01-01\",
                 \"memo\": \"CI coffee\",
                 \"postings\": [
                   {\"account\": $ACCOUNT, \"amount\": \"-12.34\", \"sort_order\": 0},
                   {\"category\": $CATEGORY, \"amount\": \"12.34\", \"sort_order\": 1}
                 ]}" > /dev/null

          curl -fsS -H "$AUTH" \
            "$API/api/v1/finance/transactions/?budget_file=$BUDGET_FILE" \
            | python3 -c 'import sys,json; page=json.load(sys.stdin); assert page["count"]==1, page; assert page["results"][0]["memo"]=="CI coffee", page'

          echo "End-to-end register -> token -> ledger transaction OK"

      - name: Assert no placeholder secret is in use
        run: |
          docker compose exec -T api python -c "
          from django.conf import settings
          assert settings.SECRET_KEY, 'SECRET_KEY is empty'
          assert settings.SECRET_KEY != 'some-random-secret-key', 'shipping the old public key'
          assert settings.DEBUG is False, 'DEBUG must be off in the default stack'
          print('settings OK')
          "

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Install browser
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Start the stack
        # The Playwright suite registers a fresh user per spec (several
        # register two - see workspace.spec.ts and audit-log.spec.ts), which
        # comfortably clears the production THROTTLE_REGISTER default of
        # 5/hour once THROTTLE_* is actually enforced correctly across all
        # gunicorn workers (see the Redis CACHES change in app/settings/base.py)
        # instead of being split - and silently loosened - per worker.
        run: |
          export THROTTLE_REGISTER=1000/hour
          export THROTTLE_LOGIN=1000/min
          make bootstrap && docker compose up -d --build

      - name: Wait for the API
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8000/healthz/ > /dev/null; then
              echo "API healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          docker compose logs
          exit 1

      # Drives the real stack through the browser: register, sign in, add a
      # transaction, see it listed and summed on the dashboard. Includes
      # accessibility.spec.ts, which runs axe over every page and both modal
      # surfaces - that is the accessibility gate, so it is deliberately not a
      # separate optional job.
      - name: Run Playwright
        working-directory: apps/web
        run: pnpm exec playwright test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

name: Publish images

# Publishes multi-architecture images to GHCR. The previously published
# `:latest` tags were arm64-only and hand-pushed, so they could not run on the
# x86_64 hosts most people self-host on.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: api
            context: ./apps/api
          - name: web
            context: ./apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/fintrack-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-sdk-ts:
    # Publishes @fintrack/sdk to npm when an NPM_TOKEN secret is configured;
    # without it the job builds and exits, so forks are unaffected.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Build
        working-directory: packages/sdk-ts
        run: pnpm install --frozen-lockfile && pnpm run build

      - name: Publish
        working-directory: packages/sdk-ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN not configured; skipping publish."
            exit 0
          fi
          pnpm publish --access public --no-git-checks

  publish-sdk-py:
    # Publishes fintrack-sdk to PyPI when a PYPI_API_TOKEN secret exists;
    # without it the job builds and exits, so forks are unaffected.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7

      - name: Build
        working-directory: packages/sdk-py
        run: uv build

      - name: Publish
        working-directory: packages/sdk-py
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$UV_PUBLISH_TOKEN" ]; then
            echo "PYPI_API_TOKEN not configured; skipping publish."
            exit 0
          fi
          uv publish

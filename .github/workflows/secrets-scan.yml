name: Secrets Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks scans history, not just the working tree: a secret that
          # was committed and then deleted is still a leaked secret.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Placeholders, generated clients and ORM keyword arguments that read
          # like credentials are allowlisted here rather than with inline
          # `gitleaks:allow` comments, so the reasoning stays in one file.
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
          # gitleaks-action is free for personal repos; organization-owned
          # repos need a (free) license key. Set the GITLEAKS_LICENSE secret if
          # you fork this into an org, otherwise the job fails on startup.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

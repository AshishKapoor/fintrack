[project]
name = "fintrack-api"
version = "1.0.0"
description = "FinTrack API - privacy-first, self-hostable personal finance tracker"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.4",
    "cryptography>=43.0",
    # Held on the 6.0 line: drf-spectacular, django-extensions and
    # djangorestframework-simplejwt do not declare Django 6.1 support yet.
    # Lift the ceiling once they do.
    "django>=6.0,<6.1",
    "django-extensions>=4.1",
    "djangorestframework>=3.16.1",
    "drf-spectacular[sidecar]>=0.30.0",
    "psycopg[binary]>=3.2.6",
    "python-dotenv>=1.1.0",
    "django-cors-headers>=4.9.0",
    "djangorestframework-simplejwt>=5.5.1",
    "gunicorn>=23.0.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pre-commit>=4.2.0",
    "ruff>=0.10.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "env",
    "venv",
    "migrations",
    "node_modules",
    "static",
    "media",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C90",  # mccabe complexity
]

ignore = [
    "E501",
]

fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = 88

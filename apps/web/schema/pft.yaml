components:
  schemas:
    AICategorizationSettings:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        budget_file:
          type: integer
        is_enabled:
          type: boolean
        provider:
          $ref: '#/components/schemas/AICategorizationSettingsProviderEnum'
        base_url:
          type: string
          maxLength: 500
        model_name:
          type: string
          maxLength: 100
        has_api_key:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - budget_file
      - created_at
      - has_api_key
      - id
      - updated_at
    AICategorizationSettingsProviderEnum:
      enum:
      - openai_compatible
      - ollama
      type: string
      description: |-
        * `openai_compatible` - OpenAI-compatible (bring your own key)
        * `ollama` - Ollama (local)
    Account:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        budget_file:
          type: integer
        name:
          type: string
          maxLength: 120
        type:
          $ref: '#/components/schemas/TypeEnum'
        opening_balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        currency_code:
          type: string
          maxLength: 3
        current_balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        interest_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
          description: Annual percentage rate, e.g. 19.99 for 19.99% APR.
        minimum_payment:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          nullable: true
        is_archived:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - budget_file
      - created_at
      - current_balance
      - id
      - name
      - updated_at
    ActionEnum:
      enum:
      - created
      - updated
      - deleted
      type: string
      description: |-
        * `created` - Created
        * `updated` - Updated
        * `deleted` - Deleted
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        organization:
          type: integer
        actor_email:
          type: string
          maxLength: 254
        action:
          $ref: '#/components/schemas/ActionEnum'
        entity_type:
          type: string
          maxLength: 64
        entity_id:
          type: string
          maxLength: 64
        summary:
          type: string
          maxLength: 255
        changes: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - created_at
      - entity_type
      - id
      - organization
      - summary
    BankSyncInstitution:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        logo:
          type: string
      required:
      - id
      - logo
      - name
    BankSyncLinkResult:
      type: object
      properties:
        redirect_url:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
    BankSyncProvider:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        configured:
          type: boolean
      required:
      - configured
      - key
      - label
    BankSyncResult:
      type: object
      properties:
        accounts_synced:
          type: integer
        created:
          type: integer
        skipped:
          type: integer
        errors:
          type: array
          items:
            type: string
      required:

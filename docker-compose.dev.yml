# Development overlay: source bind-mounts and Django's autoreloading server.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# or simply `make dev`.
#
# The bind mounts below shadow the .venv that apps/api/Dockerfile builds into
# /app, so these services need `uv run` to sync a venv from scratch on first
# run instead of skipping sync like the prod image does - see UV_NO_SYNC in
# apps/api/Dockerfile.

services:
  api:
    environment:
      DJANGO_SETTINGS_MODULE: app.settings.dev
      DJANGO_ENV: development
      DEBUG: "True"
      UV_NO_SYNC: "0"
    volumes:
      - ./apps/api:/app
      - api_run:/app/run

  migrate:
    environment:
      DJANGO_SETTINGS_MODULE: app.settings.dev
      DJANGO_ENV: development
      DEBUG: "True"
      UV_NO_SYNC: "0"
    volumes:
      - ./apps/api:/app
      - api_run:/app/run

  worker:
    environment:
      DJANGO_SETTINGS_MODULE: app.settings.dev
      DJANGO_ENV: development
      DEBUG: "True"
      UV_NO_SYNC: "0"
    volumes:
      - ./apps/api:/app
      - api_run:/app/run

  beat:
    environment:
      DJANGO_SETTINGS_MODULE: app.settings.dev
      DJANGO_ENV: development
      DEBUG: "True"
      UV_NO_SYNC: "0"
    volumes:
      - ./apps/api:/app
      - api_run:/app/run

  db:
    ports:
      - "5432:5432"

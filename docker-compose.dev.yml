# Development overlay: source bind-mounts and Django's autoreloading server.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# or simply `make dev`.

services:
  api:
    environment:
      DJANGO_SETTINGS_MODULE: app.settings.dev
      DJANGO_ENV: development
      DEBUG: "True"
    volumes:
      - ./apps/api:/app
      - api_run:/app/run

  migrate:
    environment:
      DJANGO_SETTINGS_MODULE: app.settings.dev
      DJANGO_ENV: development
      DEBUG: "True"
    volumes:
      - ./apps/api:/app
      - api_run:/app/run

  worker:
    environment:
      DJANGO_SETTINGS_MODULE: app.settings.dev
      DJANGO_ENV: development
      DEBUG: "True"
    volumes:
      - ./apps/api:/app
      - api_run:/app/run

  db:
    ports:
      - "5432:5432"

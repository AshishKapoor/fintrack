x-django-env: &django-env
  DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-app.settings.prod}
  DJANGO_ENV: ${DJANGO_ENV:-production}
  DEBUG: ${DEBUG:-False}
  SECRET_KEY: ${SECRET_KEY:-}
  SECRET_KEY_FILE: /app/run/.secret_key
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost 127.0.0.1 [::1]}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:5173}
  SECURE_SSL: ${SECURE_SSL:-False}
  DATABASE_NAME: ${POSTGRES_DB:-fintrack}
  DATABASE_USER: ${POSTGRES_USER:-fintrack}
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-fintrack_local_dev}
  DATABASE_HOST: db
  DATABASE_PORT: 5432
  REDIS_URL: redis://redis:6379/0
  # Same defaults base.py falls back to when these are unset - only present
  # here so CI/e2e can loosen them for automated test runs (many specs each
  # register their own user) without touching the strict production values.
  THROTTLE_LOGIN: ${THROTTLE_LOGIN:-10/min}
  THROTTLE_REGISTER: ${THROTTLE_REGISTER:-5/hour}
  THROTTLE_PASSWORD_CHANGE: ${THROTTLE_PASSWORD_CHANGE:-5/min}
  THROTTLE_ADMIN_LOGIN: ${THROTTLE_ADMIN_LOGIN:-10/min}
  THROTTLE_NOTIFICATION_TEST: ${THROTTLE_NOTIFICATION_TEST:-10/hour}
  THROTTLE_BANK_SYNC: ${THROTTLE_BANK_SYNC:-30/hour}
  THROTTLE_FX_SYNC: ${THROTTLE_FX_SYNC:-10/hour}
  # Notifications engine (see docs/self-hosting.md#email). Empty EMAIL_HOST
  # means base.py's console backend - notifications still "work", they just
  # print to the api/worker container logs instead of sending real mail.
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
  EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-FinTrack <notifications@fintrack.local>}
  # Bank sync (see docs/self-hosting.md#bank-sync). Empty GOCARDLESS_SECRET_ID/
  # KEY just means that provider reports itself unavailable; SimpleFIN needs
  # no instance-wide config. FINTRACK_FRONTEND_URL is where GoCardless sends
  # the user back after they finish authenticating at their bank.
  FINTRACK_SYNC_ENCRYPTION_KEY: ${FINTRACK_SYNC_ENCRYPTION_KEY:-}
  GOCARDLESS_SECRET_ID: ${GOCARDLESS_SECRET_ID:-}
  GOCARDLESS_SECRET_KEY: ${GOCARDLESS_SECRET_KEY:-}
  FINTRACK_FRONTEND_URL: ${FINTRACK_FRONTEND_URL:-http://localhost:5173}

services:
  api:
    build:
      context: ./apps/api
    image: ghcr.io/ashishkapoor/fintrack-api:latest
    # Build from the checked-out source rather than silently pulling a published
    # tag that may be older than this working tree.
    pull_policy: build
    environment:
      <<: *django-env
    volumes:
      - api_run:/app/run
      - static_files:/app/staticfiles
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - fintrack_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  migrate:
    build:
      context: ./apps/api
    image: ghcr.io/ashishkapoor/fintrack-api:latest
    pull_policy: build
    working_dir: /app
    entrypoint: ["sh", "/entrypoint.migrate.sh"]
    environment:
      <<: *django-env
      FINTRACK_ADMIN_EMAIL: ${FINTRACK_ADMIN_EMAIL:-}
      FINTRACK_ADMIN_PASSWORD: ${FINTRACK_ADMIN_PASSWORD:-}
    volumes:
      - api_run:/app/run
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fintrack_network
    restart: "no"

  web:
    build:
      context: ./apps/web
    image: ghcr.io/ashishkapoor/fintrack-web:latest
    pull_policy: build
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - api
    networks:
      - fintrack_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: ./apps/api
    image: ghcr.io/ashishkapoor/fintrack-api:latest
    pull_policy: build
    # Same image as the api; only the process differs. Imports and exports run
    # here so a big statement never ties up a web worker. compilemessages
    # recompiles locale/*/LC_MESSAGES/*.po into the .mo files translated
    # notification text needs (see entrypoint.sh for the full rationale -
    # `make dev`'s bind mount shadows the ones baked in at image build time).
    entrypoint:
      - sh
      - -c
      - /usr/local/bin/wait-for-db.sh && uv run manage.py compilemessages --verbosity 0 && exec uv run celery -A app worker --loglevel=info --concurrency=2
    environment:
      <<: *django-env
    volumes:
      # Without this, resolve_secret_key() (app/settings/base.py) cannot see
      # the key `api` persisted and silently generates its own ephemeral one
      # per restart instead - harmless for a pure task processor today, but
      # sharing it is one less way for the processes to drift.
      - api_run:/app/run
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - fintrack_network
    restart: unless-stopped

  beat:
    build:
      context: ./apps/api
    image: ghcr.io/ashishkapoor/fintrack-api:latest
    pull_policy: build
    # Same image again; this process only submits the periodic tasks defined
    # in CELERY_BEAT_SCHEDULE (app/settings/base.py) - `worker` still does the
    # actual work. A lightweight, file-based schedule is fine here: losing it
    # on a restart just means the next daily prune fires up to a day late.
    entrypoint:
      - sh
      - -c
      - /usr/local/bin/wait-for-db.sh && uv run manage.py compilemessages --verbosity 0 && exec uv run celery -A app beat --loglevel=info --schedule=/app/run/celerybeat-schedule
    environment:
      <<: *django-env
    volumes:
      # /app/run is where resolve_secret_key() looks for the persisted key,
      # and now also where beat keeps its own schedule state, so a restart
      # does not lose track of when each periodic task last ran. Without a
      # volume here at all, /app/run does not exist in the container - beat's
      # PersistentScheduler raised an unhandled "No such file or directory"
      # and crash-looped instead of the graceful ephemeral-key fallback
      # resolve_secret_key() has for the same missing directory.
      - api_run:/app/run
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - fintrack_network
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    networks:
      - fintrack_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fintrack}
      POSTGRES_USER: ${POSTGRES_USER:-fintrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintrack_local_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fintrack_network
    # Not published to the host by default. Uncomment only if you need to connect
    # a local client, and set a real POSTGRES_PASSWORD first.
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fintrack} -d ${POSTGRES_DB:-fintrack}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  static_files:
  api_run:

networks:
  fintrack_network:
    driver: bridge

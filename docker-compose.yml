x-django-env: &django-env
  DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-app.settings.prod}
  DJANGO_ENV: ${DJANGO_ENV:-production}
  DEBUG: ${DEBUG:-False}
  SECRET_KEY: ${SECRET_KEY:-}
  SECRET_KEY_FILE: /app/run/.secret_key
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost 127.0.0.1 [::1]}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:5173}
  SECURE_SSL: ${SECURE_SSL:-False}
  DATABASE_NAME: ${POSTGRES_DB:-fintrack}
  DATABASE_USER: ${POSTGRES_USER:-fintrack}
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-fintrack_local_dev}
  DATABASE_HOST: db
  DATABASE_PORT: 5432
  REDIS_URL: redis://redis:6379/0

services:
  api:
    build:
      context: ./apps/api
    image: ghcr.io/ashishkapoor/fintrack-api:latest
    # Build from the checked-out source rather than silently pulling a published
    # tag that may be older than this working tree.
    pull_policy: build
    environment:
      <<: *django-env
    volumes:
      - api_run:/app/run
      - static_files:/app/staticfiles
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - fintrack_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  migrate:
    build:
      context: ./apps/api
    image: ghcr.io/ashishkapoor/fintrack-api:latest
    pull_policy: build
    working_dir: /app
    entrypoint: ["sh", "/entrypoint.migrate.sh"]
    environment:
      <<: *django-env
      FINTRACK_ADMIN_EMAIL: ${FINTRACK_ADMIN_EMAIL:-}
      FINTRACK_ADMIN_PASSWORD: ${FINTRACK_ADMIN_PASSWORD:-}
    volumes:
      - api_run:/app/run
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fintrack_network
    restart: "no"

  web:
    build:
      context: ./apps/web
    image: ghcr.io/ashishkapoor/fintrack-web:latest
    pull_policy: build
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - api
    networks:
      - fintrack_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: ./apps/api
    image: ghcr.io/ashishkapoor/fintrack-api:latest
    pull_policy: build
    # Same image as the api; only the process differs. Imports and exports run
    # here so a big statement never ties up a web worker.
    entrypoint:
      - sh
      - -c
      - /usr/local/bin/wait-for-db.sh && exec uv run celery -A app worker --loglevel=info --concurrency=2
    environment:
      <<: *django-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - fintrack_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    networks:
      - fintrack_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fintrack}
      POSTGRES_USER: ${POSTGRES_USER:-fintrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintrack_local_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fintrack_network
    # Not published to the host by default. Uncomment only if you need to connect
    # a local client, and set a real POSTGRES_PASSWORD first.
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fintrack} -d ${POSTGRES_DB:-fintrack}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  static_files:
  api_run:

networks:
  fintrack_network:
    driver: bridge

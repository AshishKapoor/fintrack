[project]
name = "fintrack-sdk"
version = "0.1.0"
description = "Typed Python client for the FinTrack API, generated from its OpenAPI schema."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "attrs>=23.2",
    "python-dateutil>=2.9",
]
keywords = ["fintrack", "personal-finance", "double-entry", "api-client"]

[project.urls]
Homepage = "https://github.com/AshishKapoor/fintrack"
Source = "https://github.com/AshishKapoor/fintrack/tree/main/packages/sdk-py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fintrack_sdk"]

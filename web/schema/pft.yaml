components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        budget_file:
          type: integer
        name:
          type: string
          maxLength: 120
        type:
          $ref: '#/components/schemas/AccountTypeEnum'
        opening_balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        current_balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        is_archived:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - budget_file
      - created_at
      - current_balance
      - id
      - name
      - updated_at
    AccountTypeEnum:
      enum:
      - checking
      - savings
      - cash
      - credit
      - asset
      - liability
      type: string
      description: |-
        * `checking` - Checking
        * `savings` - Savings
        * `cash` - Cash
        * `credit` - Credit Card
        * `asset` - Asset
        * `liability` - Liability
    ActionEnum:
      enum:
      - created
      - updated
      - deleted
      type: string
      description: |-
        * `created` - Created
        * `updated` - Updated
        * `deleted` - Deleted
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        organization:
          type: integer
        actor_email:
          type: string
          maxLength: 254
        action:
          $ref: '#/components/schemas/ActionEnum'
        entity_type:
          type: string
          maxLength: 64
        entity_id:
          type: string
          maxLength: 64
        summary:
          type: string
          maxLength: 255
        changes: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - created_at
      - entity_type
      - id
      - organization
      - summary
    Budget:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        month:
          type: integer
          maximum: 32767
          minimum: 0
        year:
          type: integer
          maximum: 2147483647
          minimum: 0
        amount_limit:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        user:
          type: integer
          readOnly: true
        category:
          type: integer
      required:
      - amount_limit
      - category
      - id
      - month
      - user
      - year
    BudgetFile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        currency_code:
          type: string
          maxLength: 3
        is_default:
          type: boolean
        organization:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
    BudgetMonth:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        budget_file:
          type: integer
        year:
          type: integer
          maximum: 2147483647
          minimum: 0
        month:
          type: integer
          maximum: 32767
          minimum: 0
        mode:
          $ref: '#/components/schemas/ModeEnum'
        notes_md:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - budget_file
      - created_at
      - id
      - month
      - updated_at
      - year
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        type:
          $ref: '#/components/schemas/TypeF1eEnum'
        user:
          type: integer
          readOnly: true
          nullable: true
      required:
      - id
      - name
      - type
      - user
    CategoryGroupV2:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        budget_file:
          type: integer
        name:
          type: string
          maxLength: 120
        sort_order:
          type: integer
          maximum: 2147483647
          minimum: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - budget_file
      - created_at
      - id
      - name
      - updated_at
    CategoryV2:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        budget_file:
          type: integer
        group:
          type: integer
          nullable: true
        name:
          type: string
          maxLength: 120
        kind:
          $ref: '#/components/schemas/KindEnum'
        is_archived:
          type: boolean
        notes_md:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - budget_file
      - created_at
      - id
      - name
      - updated_at
    DepartmentEnum:
      enum:
      - engineering
      - finance
      - hr
      - marketing
      - sales
      - other
      type: string
      description: |-
        * `engineering` - Engineering
        * `finance` - Finance
        * `hr` - HR
        * `marketing` - Marketing
        * `sales` - Sales
        * `other` - Other
    EncryptedBackupBundle:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        bundle_id:
          type: string
          format: uuid
          readOnly: true
        budget_file:
          type: integer
        encryption_algorithm:
          type: string
          maxLength: 32
        key_derivation:
          type: string
          maxLength: 32
        salt:
          type: string
        nonce:
          type: string
        ciphertext:
          type: string
        metadata: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - budget_file
      - bundle_id
      - ciphertext
      - created_at
      - id
      - nonce
      - salt
    EnvelopeAssignment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        budget_month:
          type: integer
        category:
          type: integer
        assigned_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        carryover_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        goal_type:
          $ref: '#/components/schemas/GoalTypeEnum'
        goal_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          nullable: true
        goal_date:
          type: string
          format: date
          nullable: true
        goal_schedule:
          type: string
          maxLength: 200
        priority:
          type: integer
          maximum: 2147483647
          minimum: 0
        notes_md:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - budget_month
      - category
